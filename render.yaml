services:
  - type: web
    name: nutriledger-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    initialDeployHook: python bootstrap_owner.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutriledger-db
          property: internalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://nutriledger-web.onrender.com
      - key: INITIAL_OWNER_EMAIL
        sync: false
      - key: INITIAL_OWNER_PASSWORD
        sync: false

  - type: web
    name: nutriledger-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          name: nutriledger-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nutriledger-db
    databaseName: nutriledger
    user: nutriledger
    region: singapore
    plan: free
    ipAllowList: []
